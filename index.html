<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <script>
      // Run before module imports. Keep auth material only in this document's
      // temporary memory, never history state, storage, referrers or logs.
      (() => {
        const params = new URLSearchParams(location.search);
        const authReturn =
          location.pathname === "/auth/callback" ||
          ["code", "sb_flow_id", "access_token", "refresh_token"].some((k) =>
            params.has(k),
          ) ||
          /(?:^#|&)(?:access_token|refresh_token|code)=/.test(location.hash);
        if (authReturn) {
          window.__fonsecaAuthReturn = {
            origin: location.origin,
            pathname: location.pathname,
            search: location.search,
            hash: location.hash,
          };
          history.replaceState(null, "", "/auth/callback");
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101110" />
    <title>Fonseca Barber Club • Gestão</title>
  </head>
  <body>
    <div id="app">
      <section
        id="boot-status"
        role="status"
        style="
          max-width: 620px;
          margin: 12vh auto;
          padding: 32px;
          font:
            16px/1.6 &quot;Segoe UI&quot;,
            sans-serif;
          color: #e8e7e2;
          background: #1b1b19;
          border: 1px solid #8d7548;
          border-radius: 12px;
        "
      >
        <small style="color: #c7a66b">FONSECA BARBER CLUB</small>
        <h1 id="boot-title">Abrindo o sistema…</h1>
        <p id="boot-message">Aguarde o carregamento do aplicativo.</p>
        <a id="boot-retry" href="/inicio" style="color: #d9bb80"
          >Abrir página inicial</a
        >
        <noscript
          ><p>
            Ative o JavaScript neste navegador para abrir o sistema.
          </p></noscript
        >
      </section>
    </div>
    <script>
      (() => {
        document.body.style.background = "#101110";
        const showFailure = (title, message) => {
          const panel = document.getElementById("boot-status");
          if (!panel || panel.getAttribute("role") === "alert") return;
          panel.setAttribute("role", "alert");
          document.getElementById("boot-title").textContent = title;
          document.getElementById("boot-message").textContent = message;
        };
        if (location.protocol === "file:") {
          document.getElementById("boot-retry").href =
            "http://127.0.0.1:5174/inicio";
          showFailure(
            "Abra o sistema pelo servidor local",
            "Este index.html não funciona por duplo clique. Execute start-preview.cmd na pasta do projeto e abra http://127.0.0.1:5174/. Nenhum dado foi perdido.",
          );
        } else {
          window.addEventListener(
            "error",
            () =>
              showFailure(
                "Não foi possível iniciar o sistema",
                "O carregamento do aplicativo falhou. Recarregue a página ou tente abrir a página inicial. Se persistir, informe o endereço ao responsável pelo sistema.",
              ),
            true,
          );
          window.addEventListener("unhandledrejection", () =>
            showFailure(
              "Não foi possível iniciar o sistema",
              "Houve uma falha durante a inicialização. Recarregue a página ou tente abrir a página inicial.",
            ),
          );
          setTimeout(
            () =>
              showFailure(
                "O carregamento está demorando",
                "O aplicativo ainda não iniciou. Verifique sua conexão e recarregue esta página.",
              ),
            12000,
          );
        }
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
